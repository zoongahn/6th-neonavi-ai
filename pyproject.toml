# Vercel 백엔드 배포 보조 설정.
#
# 실제 배포 구성은 vercel.json 의 services 에 있고(그쪽이 우선한다), 여기는
# vercel.json 없이 백엔드만 단독으로 띄울 때를 위한 대비다.
#
# Vercel 은 manage.py 를 찾아 Django 로 인식하고 WSGI_APPLICATION 에서 진입점을
# 정하는데, 우리는 manage.py 가 backend/ 아래라 명시가 필요하다.

[tool.vercel]
entrypoint = "backend/config/wsgi.py"

[tool.vercel.scripts]
# 공공데이터 파생본(27MB)은 레포에 없고 GitHub Release 자산에 있다.
# 번들에 포함되려면 빌드 때 받아야 한다(sha256 을 검증하므로 받다 끊기면
# 빌드가 실패한다 — 조용히 틀린 데이터로 배포되는 것보다 낫다).
build = "python -m ai.fetch_data"
