# Vercel 백엔드 배포 설정.
#
# Vercel 은 manage.py 를 찾아 Django 프로젝트로 인식하고, 그 파일을 실행해
# DJANGO_SETTINGS_MODULE 을 알아낸 뒤 WSGI_APPLICATION 에서 진입점을 정한다.
# 우리는 manage.py 가 backend/ 아래라 entrypoint 를 명시한다.
#
# ⚠️ 이 파일은 **백엔드 배포 전용**이다. 프론트엔드 Vercel 프로젝트는 Root
#    Directory 를 frontend/ 로 잡으므로 여기를 보지 않는다.

[tool.vercel]
entrypoint = "backend/config/wsgi.py"

[tool.vercel.scripts]
# 의존성 설치 후·배포 전에 돈다. 공공데이터 파생본(27MB)은 레포에 없고
# GitHub Release 자산에 있어서, 번들에 포함되려면 여기서 받아야 한다.
# (sha256 을 검증하므로 받다 끊기면 빌드가 실패한다 — 조용히 틀린 데이터로
#  배포되는 것보다 낫다)
build = "python -m ai.fetch_data"
